<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Calcula tu sueldo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <main class="container py-5">
    <div class="login-caja mx-auto">

      <h1 class="h4 text-center mb-1"><i class="bi bi-wallet2 me-2"></i>Calcula tu sueldo</h1>
      <p class="text-center text-secondary small mb-4">Organiza tu sueldo, tus gastos y lo que te queda del mes.</p>

      <section class="panel">

        <!-- Pestañas -->
        <ul class="nav nav-pills nav-fill mb-4" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-login" data-bs-toggle="pill" data-bs-target="#panel-login"
                    type="button" role="tab" aria-controls="panel-login" aria-selected="true">Iniciar sesión</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-registro" data-bs-toggle="pill" data-bs-target="#panel-registro"
                    type="button" role="tab" aria-controls="panel-registro" aria-selected="false">Crear cuenta</button>
          </li>
        </ul>

        <div class="tab-content">

          <!-- INICIAR SESIÓN -->
          <div class="tab-pane fade show active" id="panel-login" role="tabpanel" aria-labelledby="tab-login">
            <form id="formLogin" novalidate>
              <div class="mb-3">
                <label for="loginUsuario" class="form-label small text-secondary">Usuario</label>
                <input type="text" id="loginUsuario" class="form-control" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label for="loginClave" class="form-label small text-secondary">Contraseña</label>
                <input type="password" id="loginClave" class="form-control" autocomplete="current-password" required>
              </div>
              <div id="msgLogin" class="aviso aviso-peligro d-none mb-3" role="alert"></div>
              <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
          </div>

          <!-- CREAR CUENTA -->
          <div class="tab-pane fade" id="panel-registro" role="tabpanel" aria-labelledby="tab-registro">
            <form id="formRegistro" novalidate>
              <div class="mb-3">
                <label for="regUsuario" class="form-label small text-secondary">Elige un usuario</label>
                <input type="text" id="regUsuario" class="form-control" autocomplete="username" maxlength="20" required>
                <div class="form-text text-secondary">3 a 20 caracteres: letras, números, punto o guion.</div>
              </div>
              <div class="mb-3">
                <label for="regClave" class="form-label small text-secondary">Contraseña</label>
                <input type="password" id="regClave" class="form-control" autocomplete="new-password" required>
                <div class="form-text text-secondary">Mínimo 6 caracteres.</div>
              </div>
              <div class="mb-3">
                <label for="regClave2" class="form-label small text-secondary">Repite la contraseña</label>
                <input type="password" id="regClave2" class="form-control" autocomplete="new-password" required>
              </div>
              <div id="msgRegistro" class="aviso aviso-peligro d-none mb-3" role="alert"></div>
              <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
            </form>
          </div>

        </div>
      </section>

      <p class="text-center text-secondary small mt-3">
        Tus datos se guardan solo en este dispositivo y navegador.
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
